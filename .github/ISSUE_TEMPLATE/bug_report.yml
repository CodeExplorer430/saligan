name: Bug report
description: Report reproducible incorrect behavior
title: "fix: "
labels:
  - bug
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Sensitive data
      options:
        - label: I removed secrets, credentials, personal records, and private attachments.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what should happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal ordered steps using synthetic data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: SALIGAN version/commit, browser, OS, deployment, and offline/online state.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Logs, screenshots, or errors with sensitive values removed.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Affected users, data, frequency, and workaround.
