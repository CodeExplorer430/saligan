name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate package metadata
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"

      - name: Verify governance pack
        shell: bash
        run: |
          required=(
            AGENTS.md
            docs/ai/QUALITY-GATES.md
            docs/ai/SECURITY-RULES.md
            docs/engineering/DEFINITION-OF-DONE.md
            .github/CODEOWNERS
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing required file: $file"; exit 1; }
          done

  quality:
    name: pnpm quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect bootstrap readiness
        id: ready
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]] && [[ -f turbo.json ]] &&
             find apps packages -mindepth 2 -maxdepth 2 -name package.json -print -quit 2>/dev/null | grep -q .; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping pnpm gates until lockfile, turbo config, and workspace packages exist."
          fi

      - uses: pnpm/action-setup@v6
        if: steps.ready.outputs.value == 'true'
        with:
          version: 11.0.0

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.value == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: steps.ready.outputs.value == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.ready.outputs.value == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.ready.outputs.value == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.ready.outputs.value == 'true'
        run: pnpm test

      - name: Build
        if: steps.ready.outputs.value == 'true'
        run: pnpm build

      - name: Documentation checks
        if: steps.ready.outputs.value == 'true'
        run: pnpm docs:check
