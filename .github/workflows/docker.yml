name: Docker

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "packages/database/**"
      - ".github/workflows/docker.yml"
  push:
    branches:
      - main
    paths:
      - "docker-compose.yml"
      - "packages/database/**"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose model
        run: docker compose config

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Show service status
        run: docker compose ps postgres

      - name: Stop services
        if: always()
        run: docker compose down
