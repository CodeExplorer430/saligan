services:
  postgres:
    image: postgres:18
    container_name: saligan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saligan}
      POSTGRES_USER: ${POSTGRES_USER:-saligan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saligan_dev_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - saligan_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saligan} -d ${POSTGRES_DB:-saligan}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: saligan-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  saligan_postgres_data:
