openapi: 3.1.0
info:
  title: SALIGAN API
  version: 0.1.0
  description: |
    Current Sprint 0B API contract. Only the health endpoint is implemented.
    NestJS modules for users, internships, schedules, time logs, reports, and
    exports are placeholders without public routes. Product endpoint contracts
    will be added with requirement-traced controllers and tests.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API health
      security: []
      responses:
        '200':
          description: API is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: saligan-api
        version:
          type: string
          const: 0.1.0
